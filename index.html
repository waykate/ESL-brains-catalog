    const searchBox = document.getElementById("searchBox");
    const levelFilter = document.getElementById("levelFilter");
    const topicFilter = document.getElementById("topicFilter");
    const grammarFilter = document.getElementById("grammarFilter");
    const results = document.getElementById("results");
    const summary = document.getElementById("summary");

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function matches(item) {
      const q = searchBox.value.trim().toLowerCase();
      const level = levelFilter.value;
      const topic = topicFilter.value;
      const grammar = grammarFilter.value;

      const keywordOk = !q || item.keywords.includes(q);
      const levelOk = !level || item.level === level;
      const topicOk = !topic || item.topic === topic;
      const grammarOk = !grammar || item.grammar === grammar;

      return keywordOk && levelOk && topicOk && grammarOk;
    }

    function render() {
      const filtered = data.filter(matches);

      summary.textContent = `${filtered.length} lesson(s) shown out of ${data.length}`;

      if (!filtered.length) {
        results.innerHTML = `<div class="no-results">No matching lessons found.</div>`;
        return;
      }

      results.innerHTML = filtered.map(item => `
        <div class="card">
          <div class="title">
            <a href="${item.href}" target="_blank">${escapeHtml(item.title)}</a>
          </div>
          <div class="meta">
            <span class="tag">Level: ${escapeHtml(item.level)}</span>
            <span class="tag">Topic: ${escapeHtml(item.topic)}</span>
            <span class="tag">Grammar: ${escapeHtml(item.grammar)}</span>
            <span class="tag">${escapeHtml(item.extension)}</span>
          </div>
          <div class="path">${escapeHtml(item.path)}</div>
        </div>
      `).join("");
    }

    searchBox.addEventListener("input", render);
    levelFilter.addEventListener("change", render);
    topicFilter.addEventListener("change", render);
    grammarFilter.addEventListener("change", render);

    render();
  </script>
